[project]
name = "aigon-viewer"
version = "0.9.1"
description = "Standalone markdown viewer server with local and remote file support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "markdown>=3.7.0",
    "pymdown-extensions>=10.0.0",
    "Jinja2>=3.1.4",
    "httpx>=0.25.0",
    "aiofiles>=24.1.0",
    "pyyaml>=6.0.0",
    "pygments>=2.16.0",
]

[project.scripts]
aigonviewer = "aigon_viewer.cli:main"
aigonviewer_base = "aigon_viewer.server:main"

[dependency-groups]
dev = [
    "ruff>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
external = [
    "VERSION_SYNC",        # structural_lint.py
]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes (unused imports, undefined names)
    "I",      # isort (import sorting)
    "B",      # flake8-bugbear (common pitfalls)
]
ignore = [
    "E501",   # line length (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["aigon_viewer"]

[tool.ruff.format]
quote-style = "double"
